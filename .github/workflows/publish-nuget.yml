name: Publish NuGet Package

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag:
        description: Existing stable release tag to publish (for example v3.1.3)
        required: true
        type: string

permissions:
  contents: read

jobs:
  publish:
    if: ${{ github.event_name == 'workflow_dispatch' || !contains(github.ref_name, '-') }}
    runs-on: ubuntu-latest
    steps:
      - name: Resolve stable release version
        id: version
        shell: bash
        run: |
          if [[ "${{ github.event_name }}" == "workflow_dispatch" ]]; then
            tag="${{ inputs.tag }}"
          else
            tag="${GITHUB_REF_NAME}"
          fi

          if [[ ! "$tag" =~ ^v([0-9]+\.[0-9]+\.[0-9]+)$ ]]; then
            echo "::error::Tag '$tag' is not a stable semantic version tag"
            exit 1
          fi

          echo "tag=${tag}" >> "$GITHUB_OUTPUT"
          echo "new_version=${BASH_REMATCH[1]}" >> "$GITHUB_OUTPUT"

      - name: Checkout S1API
        uses: actions/checkout@v4
        with:
          ref: ${{ steps.version.outputs.tag }}
          fetch-depth: 0

      - name: Verify source version matches tag
        shell: bash
        run: |
          source_version=$(grep -oPm1 '(?<=<Version>)[^<]+' S1API/S1API.csproj)

          if [[ "$source_version" != "${{ steps.version.outputs.new_version }}" ]]; then
            echo "::error::S1API project version '$source_version' does not match tag '${{ steps.version.outputs.tag }}'"
            exit 1
          fi

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Checkout Game Assemblies
        uses: actions/checkout@v4
        with:
          repository: ${{ secrets.GAME_ASSEMBLIES_REPO }}
          token: ${{ secrets.GAME_ASSEMBLIES_TOKEN }}
          path: game-assemblies
          fetch-depth: 1

      - name: Prepare Build Inputs
        shell: bash
        run: |
          mkdir -p S1API/ScheduleOneAssemblies/Managed
          mkdir -p S1API/ScheduleOneAssemblies/MelonLoader
          mkdir -p S1API/ScheduleOneAssemblies/MelonLoaderMono

          cp -r game-assemblies/Managed/* S1API/ScheduleOneAssemblies/Managed/

          if [[ -d "game-assemblies/MelonLoader" ]]; then
            cp -r game-assemblies/MelonLoader/* S1API/ScheduleOneAssemblies/MelonLoader/
          fi

          if [[ -d "game-assemblies/MelonLoaderMono" ]]; then
            cp -r game-assemblies/MelonLoaderMono/* S1API/ScheduleOneAssemblies/MelonLoaderMono/
          elif [[ -d "game-assemblies/MelonLoader/net35" ]]; then
            cp -r game-assemblies/MelonLoader/net35/* S1API/ScheduleOneAssemblies/MelonLoaderMono/
          elif [[ -d "game-assemblies/MelonLoader" ]]; then
            cp -r game-assemblies/MelonLoader/* S1API/ScheduleOneAssemblies/MelonLoaderMono/
          else
            echo "Unable to locate Mono MelonLoader assemblies in game-assemblies"
            exit 1
          fi

          if [[ ! -f "S1API/ScheduleOneAssemblies/Managed/Unity.TextMeshPro.dll" ]]; then
            TMPRO_PATH=$(find game-assemblies -name "Unity.TextMeshPro.dll" -type f | head -1)
            if [[ -n "$TMPRO_PATH" ]]; then
              cp "$TMPRO_PATH" S1API/ScheduleOneAssemblies/Managed/
            fi
          fi

          cat > ci.build.props << 'EOF'
          <Project>
              <PropertyGroup>
                  <AutomateLocalDeployment>false</AutomateLocalDeployment>
                  <MelonLoaderAssembliesPath>$(MSBuildThisFileDirectory)S1API/ScheduleOneAssemblies/MelonLoader</MelonLoaderAssembliesPath>
                  <MelonLoaderMonoAssembliesPath>$(MSBuildThisFileDirectory)S1API/ScheduleOneAssemblies/MelonLoaderMono</MelonLoaderMonoAssembliesPath>
                  <LocalMonoDeploymentPath>null</LocalMonoDeploymentPath>
                  <MonoAssembliesPath>$(MSBuildThisFileDirectory)S1API/ScheduleOneAssemblies/Managed</MonoAssembliesPath>
              </PropertyGroup>
          </Project>
          EOF

      - name: Restore Dependencies
        run: dotnet restore S1API/S1API.csproj -p:Configuration=MonoMelon

      - name: Build Package Assembly
        run: dotnet build S1API/S1API.csproj --no-restore -c MonoMelon -v minimal

      - name: Pack NuGet Package
        run: dotnet pack S1API/S1API.csproj --no-build --no-restore -c MonoMelon /p:ContinuousIntegrationBuild=true

      - name: Publish to NuGet
        shell: bash
        env:
          NUGET_API_KEY: ${{ secrets.NUGET_API_KEY }}
        run: |
          PACKAGE="S1API/bin/MonoMelon/S1API.Forked.${{ steps.version.outputs.new_version }}.nupkg"

          if [[ ! -f "$PACKAGE" ]]; then
            echo "Expected NuGet package was not produced: $PACKAGE"
            exit 1
          fi

          echo "Publishing $PACKAGE"
          dotnet nuget push "$PACKAGE" \
            --api-key "$NUGET_API_KEY" \
            --source https://api.nuget.org/v3/index.json \
            --skip-duplicate
